org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# AGP 9 built-in Kotlin forbids the kotlin.sourceSets DSL by default, but KSP still
# registers its generated sources that way. This is the documented escape hatch from
# the AGP error message; revisit when KSP ships built-in-Kotlin support.
android.disallowKotlinSourceSets=false
